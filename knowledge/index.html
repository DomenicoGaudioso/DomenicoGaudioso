<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Knowledge — Grafo della conoscenza · Ing. Domenico Gaudioso</title>
<meta name="description" content="Grafo dinamico interattivo della knowledge base: memorie, progetti, strumenti e convenzioni di ingegneria strutturale.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f8f9d'/%3E%3Cpath d='M10 44h44' stroke='%23ffffff' stroke-width='4.5' stroke-linecap='round'/%3E%3Cpath d='M14 44v-6a18 18 0 0 1 36 0v6' stroke='%23ffd43b' stroke-width='4.5' fill='none' stroke-linecap='round'/%3E%3Cpath d='M22 44v-8M32 44v-11M42 44v-8' stroke='%23ffffff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#1b1d21; --panel:#24262b; --ink:#e8eaed; --sub:#a7adb6; --muted:#6b7078;
  --ring:#33363c;
  --article:#4fb3bf; --entity:#ecc94b; --claim:#7ea8d8; --topic:#8b93a1;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Poppins",system-ui,sans-serif;overflow:hidden}
a{color:inherit;text-decoration:none}
#stage{position:fixed;inset:0;cursor:grab;touch-action:none}
#stage.grabbing{cursor:grabbing}
#stage.hover{cursor:pointer}

/* ── top bar ── */
.bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:14px;
  padding:12px 22px;background:rgba(27,29,33,.78);backdrop-filter:blur(10px);border-bottom:1px solid var(--ring)}
.bar .logo{width:30px;height:30px;flex:none;border-radius:8px;border:2px solid var(--ink);display:grid;place-items:center;background:transparent}
.bar .logo svg{width:18px;height:18px}
.bar b{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.bar .sub{font-size:11px;color:var(--muted);font-weight:500}
.bar .count{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--sub);
  border:1px solid var(--ring);border-radius:999px;padding:4px 12px;background:var(--panel)}
.back{font-size:12.5px;font-weight:600;color:var(--sub);border:1px solid var(--ring);border-radius:999px;
  padding:6px 14px;background:var(--panel);transition:.25s;white-space:nowrap}
.back:hover{color:var(--ink);border-color:var(--article)}

/* ── legenda ── */
.legend{position:fixed;left:22px;bottom:22px;z-index:10;display:flex;flex-direction:column;gap:7px;
  background:rgba(36,38,43,.88);backdrop-filter:blur(8px);border:1px solid var(--ring);border-radius:14px;padding:13px 15px;max-height:62vh;overflow:auto}
.legend button{display:flex;align-items:center;gap:9px;font-family:inherit;font-size:12px;font-weight:600;color:var(--sub);
  background:none;border:0;cursor:pointer;padding:2px 4px;border-radius:6px;transition:.2s;text-align:left}
.legend button:hover{color:var(--ink)}
.legend button.off{opacity:.3}
.legend .dot{width:11px;height:11px;border-radius:50%;flex:none}
.legend .k{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--muted);margin-left:auto;padding-left:14px}

/* ── tooltip ── */
#tip{position:fixed;z-index:20;pointer-events:none;max-width:300px;background:#0f1013;color:#fff;
  border:1px solid var(--ring);border-radius:10px;padding:9px 13px;font-size:12px;line-height:1.45;
  box-shadow:0 12px 30px -10px rgba(0,0,0,.7);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
#tip.on{opacity:1;transform:none}
#tip b{display:block;font-size:12.5px;font-weight:600;letter-spacing:.01em}
#tip span{display:block;color:#9aa1ab;font-size:10.5px;margin-top:2px;font-family:"IBM Plex Mono",monospace}

.hint{position:fixed;right:22px;bottom:22px;z-index:10;font-size:11px;color:var(--muted);font-weight:500;
  background:rgba(36,38,43,.85);border:1px solid var(--ring);border-radius:999px;padding:7px 15px;backdrop-filter:blur(8px)}
@media(max-width:640px){.bar .sub,.hint{display:none}.legend{left:12px;bottom:12px;padding:10px 12px}}
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="bar">
  <a class="logo" href="../" title="Home"><svg viewBox="0 0 64 64"><path d="M10 44h44" stroke="#e8eaed" stroke-width="5" stroke-linecap="round"/><path d="M14 44v-6a18 18 0 0 1 36 0v6" stroke="#ecc94b" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M22 44v-8M32 44v-11M42 44v-8" stroke="#e8eaed" stroke-width="4.5" stroke-linecap="round"/></svg></a>
  <div><b>Knowledge</b><div class="sub">grafo dinamico della knowledge base · memorie, progetti, strumenti, convenzioni</div></div>
  <span class="count" id="count"></span>
  <a class="back" href="../">← Torna al sito</a>
</div>

<div class="legend" id="legend"></div>
<div class="hint">trascina i nodi · rotella = zoom · doppio click = ricentra</div>
<div id="tip"></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="../assets/kb-palette.js"></script>
<script src="graph-data.js"></script>
<script>
(function(){
"use strict";
var DATA=window.GRAPH, NODES=DATA.nodes, EDGES=DATA.edges;
var TYPES={article:{c:"#c9cdd3",l:"Progetti e memorie"},entity:{c:"#c9cdd3",l:"Strumenti e norme"},claim:{c:"#c9cdd3",l:"Convenzioni e lezioni"},topic:{c:"#c9cdd3",l:"Argomenti"}};
var vis={article:true,entity:true,claim:true,topic:true};
var visCat={};var PAL=window.KBPALETTE||{};
function col(n){return PAL[n.c]||"#c9cdd3";}
var ADJ=[]; for(var i=0;i<NODES.length;i++)ADJ.push([]);
EDGES.forEach(function(e){ADJ[e[0]].push(e[1]);ADJ[e[1]].push(e[0]);});

var maxD=1; NODES.forEach(function(n){if(n.d>maxD)maxD=n.d;});
function rad(n){return 2+5*Math.sqrt(n.d/maxD);}

var cv=document.getElementById("stage"),ctx=cv.getContext("2d");
var W,H,DPR=Math.min(window.devicePixelRatio||1,2);
var tx=0,ty=0,sc=1,txT=0,tyT=0,scT=1; /* corrente + target (lerp) */
var hovered=-1, drag=-1, panning=false, lastX=0,lastY=0, moved=0, focus=-1;

function resize(){W=window.innerWidth;H=window.innerHeight;cv.width=W*DPR;cv.height=H*DPR;
  cv.style.width=W+"px";cv.style.height=H+"px";ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener("resize",resize);resize();

/* ── fisica: d3-force se disponibile, altrimenti drift ── */
var sim=null, DPRIFT=[];
NODES.forEach(function(n,i){DPRIFT[i]=[Math.random()*6.28,Math.random()*6.28,.4+Math.random()*.7,.4+Math.random()*.7,1.5+Math.random()*3.5];});
var T=0;
if(window.d3){
  NODES.forEach(function(n){n.x=n.x; n.y=n.y;});
  sim=d3.forceSimulation(NODES)
    .force("charge", d3.forceManyBody().strength(-34).distanceMax(260))
    .force("link", d3.forceLink(EDGES.map(function(e){return {source:e[0],target:e[1]};}))
        .id(function(d,i){return i;}).distance(30).strength(0.55))
    .force("collide", d3.forceCollide(function(d){return rad(d)+2.5;}))
    .force("x", d3.forceX(0).strength(0.028))
    .force("y", d3.forceY(0).strength(0.028))
    .alphaDecay(0.02)
    .velocityDecay(0.4)
    .alpha(0.1)
    .on("tick", function(){})
    .alphaTarget(0.005); /* respiro leggero: la forma resta quella cotta */
}else{
  NODES.forEach(function(n){n.x=n.x; n.y=n.y;});
}
function heat(a){ if(sim) sim.alphaTarget(a).alpha(Math.max(sim.alpha(),a)).restart(); }

/* viewport */
function fit(){
  var xs=[],ys=[];
  NODES.forEach(function(n){xs.push(n.x);ys.push(n.y);});
  var mnx=Math.min.apply(0,xs),mxx=Math.max.apply(0,xs),mny=Math.min.apply(0,ys),mxy=Math.max.apply(0,ys);
  var cx=(mnx+mxx)/2,cy=(mny+mxy)/2,span=Math.max(mxx-mnx,mxy-mny)||1;
  scT=Math.min(W,H)*0.84/span; txT=W/2-cx*scT; tyT=H/2-cy*scT;
}
fit();

function toScreen(d){return [d.x*sc+tx, d.y*sc+ty];}
function nearest(mx,my){
  var best=-1,bd=1e9;
  for(var i=0;i<NODES.length;i++){ if(!vis[NODES[i].t]||visCat[NODES[i].c]===false)continue;
    var p=toScreen(NODES[i]),dx=p[0]-mx,dy=p[1]-my,d=dx*dx+dy*dy,rr=Math.max(rad(NODES[i])*sc,12)+6;
    if(d<rr*rr&&d<bd){bd=d;best=i;}
  } return best;
}

cv.addEventListener("pointerdown",function(e){
  cv.setPointerCapture(e.pointerId);moved=0;
  var i=nearest(e.clientX,e.clientY);
  if(i>=0){drag=i;heat(0.12);}
  else{panning=true;}
  lastX=e.clientX;lastY=e.clientY;cv.classList.add("grabbing");
});
cv.addEventListener("pointermove",function(e){
  if(drag>=0){
    var nx=(e.clientX-tx)/sc, ny=(e.clientY-ty)/sc;
    NODES[drag].x=nx;NODES[drag].y=ny;
    NODES[drag].vx=0;NODES[drag].vy=0;moved++;
    heat(0.1);
  }else if(panning){
    tx+=e.clientX-lastX;ty+=e.clientY-lastY;
    txT=tx;tyT=ty;moved++;
    lastX=e.clientX;lastY=e.clientY;
  }else{
    hovered=nearest(e.clientX,e.clientY);
    cv.classList.toggle("hover",hovered>=0);
    var tip=document.getElementById("tip");
    if(hovered>=0){var n=NODES[hovered];
      tip.innerHTML="<b>"+n.n.replace(/</g,"&lt;")+"</b><span>"+String(n.c||"").toUpperCase()+" · "+TYPES[n.t].l+" · "+n.d+" collegamenti</span>";
      tip.style.left=Math.min(e.clientX+16,W-310)+"px";tip.style.top=Math.min(e.clientY+16,H-80)+"px";
      tip.classList.add("on");
    }else tip.classList.remove("on");
  }
});
cv.addEventListener("pointerup",function(){
  if(drag>=0&&moved<3){ focus=(ADJ[drag].length)?drag:-1; }
  if(drag>=0)heat(0.005);
  drag=-1;panning=false;cv.classList.remove("grabbing");
  document.getElementById("tip").classList.remove("on");
});
cv.addEventListener("dblclick",function(){fit();focus=-1;});
cv.addEventListener("wheel",function(e){
  e.preventDefault();
  var f=e.deltaY<0?1.12:1/1.12, ns=Math.min(Math.max(scT*f,15),5000);
  txT=e.clientX-(e.clientX-txT)*ns/scT; tyT=e.clientY-(e.clientY-tyT)*ns/scT; scT=ns;
},{passive:false});

/* legend */
var lg=document.getElementById("legend");
var catCount={};NODES.forEach(function(n){catCount[n.c]=(catCount[n.c]||0)+1;});
var cats=Object.keys(catCount).sort(function(a,b){return catCount[b]-catCount[a];});
cats=cats.filter(function(c){return c!=="Altro"&&c!=="Categorie";}).slice(0,14);
if(catCount["Altro"])cats.push("Altro");
cats.forEach(function(c){
  var b=document.createElement("button");
  b.innerHTML='<span class="dot" style="background:'+(PAL[c]||"#7d8590")+'"></span>'+c+'<span class="k">'+catCount[c]+"</span>";
  b.onclick=function(){visCat[c]=visCat[c]===false?true:false;b.classList.toggle("off",visCat[c]===false);focus=-1;};
  lg.appendChild(b);
});
document.getElementById("count").textContent=NODES.length+" nodi · "+EDGES.length+" collegamenti";

/* render */
function frame(){
  T+=0.016;
  if(!sim){ /* fallback drift */
    for(var i=0;i<NODES.length;i++){ if(i!==drag&&i!==hovered){
      var p=DPRIFT[i];
      NODES[i].x+=Math.sin(T*p[2]+p[0])*0.05*p[4];
      NODES[i].y+=Math.cos(T*p[3]+p[1])*0.05*p[4];
    }}
  }
  tx+=(txT-tx)*0.14; ty+=(tyT-ty)*0.14; sc+=(scT-sc)*0.14;
  ctx.clearRect(0,0,W,H);
  var hi=hovered>=0?hovered:focus;
  var inGlow=null;
  if(hi>=0){inGlow=[];ADJ[hi].forEach(function(j){inGlow[j]=1;});inGlow[hi]=1;}
  /* edges */
  ctx.lineWidth=1;
  var hic=hi>=0?col(NODES[hi]):"#e0747c";
  for(var e=0;e<EDGES.length;e++){
    var a=EDGES[e][0],b=EDGES[e][1];
    var ta=NODES[a].t,tb=NODES[b].t;
    if(!vis[ta]||!vis[tb]||visCat[NODES[a].c]===false||visCat[NODES[b].c]===false)continue;
    var pa=toScreen(NODES[a]),pb=toScreen(NODES[b]);
    if((pa[0]<0&&pb[0]<0)||(pa[0]>W&&pb[0]>W)||(pa[1]<0&&pb[1]<0)||(pa[1]>H&&pb[1]>H))continue;
    if(inGlow&&inGlow[a]&&inGlow[b]){ctx.strokeStyle=hic;ctx.globalAlpha=.55;}
    else{ctx.strokeStyle="rgba(201,205,211,"+(inGlow?".03":".13")+")";}
    ctx.beginPath();ctx.moveTo(pa[0],pa[1]);ctx.lineTo(pb[0],pb[1]);ctx.stroke();ctx.globalAlpha=1;
  }
  /* nodes */
  for(var i=0;i<NODES.length;i++){
    var n=NODES[i];if(!vis[n.t])continue;
    var p=toScreen(n);
    if(p[0]<-12||p[0]>W+12||p[1]<-12||p[1]>H+12)continue;
    var rr=rad(n)*Math.min(Math.max(sc,0.6),2.4)*(i===hi?1.5:1);
    if(inGlow){ctx.globalAlpha=(i===hi)?1:(inGlow[i]?0.95:0.07);}
    ctx.beginPath();ctx.arc(p[0],p[1],rr,0,6.2832);
    ctx.fillStyle=(inGlow&&i===hi)?"#ffffff":col(n);ctx.fill();
    if(i===hi){ctx.globalAlpha=1;ctx.lineWidth=2;ctx.strokeStyle="rgba(255,255,255,.9)";ctx.stroke();}
    ctx.globalAlpha=1;
  }
  requestAnimationFrame(frame);
}
frame();
})();
</script>
</body>
</html>
